<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monkey Mechanics Accounts</title>
<style>
  body { font-family: Arial, sans-serif; background: #FFEB3B; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.3); width: 350px; text-align: center; }
  img.logo { width: 120px; margin-bottom: 15px; }
  h2, h3 { margin-bottom: 15px; }
  input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
  button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #4CAF50; color: white; cursor: pointer; font-size: 16px; }
  button:hover { background: #45a049; }
  .message { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <img src="Logo.png" alt="Logo" class="logo">
  <h2>Monkey Mechanics Accounts</h2>

  <div id="signupDiv">
    <h3>Sign Up</h3>
    <input type="text" id="signupUsername" placeholder="Username" required>
    <input type="email" id="signupEmail" placeholder="Email" required>
    <input type="password" id="signupPassword" placeholder="Password" required>
    <input type="text" id="humanCheck" placeholder="Are you human? Type YES" required>
    <button onclick="signup()">Sign Up</button>
    <p class="message" id="signupMessage"></p>
  </div>

  <div id="loginDiv">
    <h3>Login</h3>
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPass" placeholder="Password" required>
    <button onclick="login()">Login</button>
    <p class="message" id="loginMessage"></p>
  </div>
  <button id="resendBtn" style="display:none;" onclick="resendVerification()">Resend Verification Email</button>
<p id="resendMessage"></p>


  <div id="welcomeDiv" style="display:none;">
    <h3 id="welcomeMsg"></h3>
    <p>Please return to the site you wish to access, you are now logged in!</p>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCF3esrFmnrLo3czErYRy1wkbRqEZfHliY",
    authDomain: "monkeymechanicsaccounts.firebaseapp.com",
    projectId: "monkeymechanicsaccounts",
    storageBucket: "monkeymechanicsaccounts.firebasestorage.app",
    messagingSenderId: "210326823006",
    appId: "1:210326823006:web:28d87c66a7d1c5a35594cf"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Signup function
  async function signup() {
    const username = document.getElementById('signupUsername').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value.trim();
    const human = document.getElementById('humanCheck').value.trim().toUpperCase();
    const msg = document.getElementById('signupMessage');

    if (!username || !email || !password || human !== "YES") {
      msg.textContent = "All fields are required and human check must be YES!";
      msg.style.color = "red";
      return;
    }

    try {
      const userCredential = await auth.createUserWithEmailAndPassword(email, password);
      const user = userCredential.user;

      // Send verification email
      await user.sendEmailVerification();

      // Save username in Firestore
      await db.collection('users').doc(user.uid).set({ username });

      msg.textContent = "Sign up successful! Check your email to verify before login.";
      msg.style.color = "green";
    } catch (error) {
      msg.textContent = error.message;
      msg.style.color = "red";
    }
  }

  // Login function
  async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const msg = document.getElementById('loginMessage');

    try {
      const userCredential = await auth.signInWithEmailAndPassword(email, password);
      const user = userCredential.user;

      if (!user.emailVerified) {
        msg.textContent = "Please verify your email before logging in!";
        msg.style.color = "red";
        auth.signOut();
        return;
      }

      // Get username from Firestore
      const doc = await db.collection('users').doc(user.uid).get();
      const username = doc.exists ? doc.data().username : email;

      // Show welcome message
      document.getElementById('signupDiv').style.display = 'none';
      document.getElementById('loginDiv').style.display = 'none';
      document.getElementById('welcomeDiv').style.display = 'block';
      document.getElementById('welcomeMsg').textContent = `Hello, ${username}!`;
    } catch (error) {
      msg.textContent = error.message;
      msg.style.color = "red";
    }
  }
</script>
  <!-- At the very end of login.html, before </body> -->

  // --- Resend verification function ---
  async function resendVerification() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const msg = document.getElementById('resendMessage');

    if (!email || !password) {
      msg.textContent = "Enter email and password first!";
      msg.style.color = "red";
      return;
    }

    try {
      const userCredential = await auth.signInWithEmailAndPassword(email, password);

      } else {
        await user.sendEmailVerification();
        msg.textContent = "Verification email sent!";

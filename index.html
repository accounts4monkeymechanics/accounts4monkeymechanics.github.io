<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monkey Mechanics Accounts</title>
<style>
  body { 
    font-family: Arial, sans-serif; 
    background: #FFEB3B; /* bright yellow background */ 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0;
  }

  .container { 
    background: white; /* white card */ 
    padding: 30px; 
    border-radius: 15px; 
    box-shadow: 0 0 20px rgba(0,0,0,0.3); 
    width: 350px; 
    text-align: center;
  }

  img.logo {
    width: 120px;
    margin-bottom: 15px;
  }

  h2 { margin-bottom: 15px; }
  h3 { margin-bottom: 10px; }

  input { 
    width: 100%; 
    padding: 10px; 
    margin: 8px 0; 
    border-radius: 5px; 
    border: 1px solid #ccc; 
    box-sizing: border-box;
  }

  button { 
    width: 100%; 
    padding: 10px; 
    margin: 10px 0; 
    border-radius: 5px; 
    border: none; 
    background: #4CAF50; 
    color: white; 
    cursor: pointer; 
    font-size: 16px;
  }

  button:hover { background: #45a049; }

  .message { margin-top: 10px; font-weight: bold; }

</style>
</head>
<body>

<div class="container">
  <img src="Logo.png" alt="Logo" class="logo">
  <h2>Monkey Mechanics Accounts</h2>

  <div id="signupDiv">
    <h3>Sign Up</h3>
    <input type="email" id="signupEmail" placeholder="Email" required>
    <input type="text" id="signupUsername" placeholder="Username" required>
    <input type="password" id="signupPassword" placeholder="Password" required>
    <input type="text" id="humanCheck" placeholder="Are you human? Type YES" required>
    <input type="email" id="signupEmailVerify" placeholder="Re-enter Email" required>
    <button onclick="signup()">Sign Up</button>
    <p class="message" id="signupMessage"></p>
  </div>

  <div id="loginDiv">
    <h3>Login</h3>
    <input type="text" id="loginUser" placeholder="Username or Email" required>
    <input type="password" id="loginPass" placeholder="Password" required>
    <button onclick="login()">Login</button>
    <p class="message" id="loginMessage"></p>
  </div>

  <div id="welcomeDiv" style="display:none;">
    <h3 id="welcomeMsg"></h3>
    <p>Please return to the site you wish to access, you are now logged in!</p>
  </div>
</div>

<script>
  function signup() {
    const email = document.getElementById('signupEmail').value.trim();
    const username = document.getElementById('signupUsername').value.trim();
    const password = document.getElementById('signupPassword').value.trim();
    const human = document.getElementById('humanCheck').value.trim().toUpperCase();
    const emailVerify = document.getElementById('signupEmailVerify').value.trim();
    const msg = document.getElementById('signupMessage');

    if(!email || !username || !password || !human || !emailVerify) {
      msg.textContent = "All fields are required!";
      msg.style.color = "red";
      return;
    }

    if(human !== "YES") {
      msg.textContent = "Human verification failed!";
      msg.style.color = "red";
      return;
    }

    if(email !== emailVerify) {
      msg.textContent = "Emails do not match!";
      msg.style.color = "red";
      return;
    }

    const users = JSON.parse(localStorage.getItem('mm_users') || "[]");
    if(users.find(u => u.username === username || u.email === email)) {
      msg.textContent = "Username or email already exists!";
      msg.style.color = "red";
      return;
    }

    users.push({email, username, password});
    localStorage.setItem('mm_users', JSON.stringify(users));
    msg.textContent = "Sign up successful! You can now log in.";
    msg.style.color = "green";

    document.getElementById('signupEmail').value = '';
    document.getElementById('signupUsername').value = '';
    document.getElementById('signupPassword').value = '';
    document.getElementById('humanCheck').value = '';
    document.getElementById('signupEmailVerify').value = '';
  }

  function login() {
    const userInput = document.getElementById('loginUser').value.trim();
    const passInput = document.getElementById('loginPass').value.trim();
    const msg = document.getElementById('loginMessage');

    const users = JSON.parse(localStorage.getItem('mm_users') || "[]");
    const user = users.find(u => (u.username === userInput || u.email === userInput) && u.password === passInput);

    if(user) {
      document.getElementById('signupDiv').style.display = 'none';
      document.getElementById('loginDiv').style.display = 'none';
      document.getElementById('welcomeDiv').style.display = 'block';
      document.getElementById('welcomeMsg').textContent = `Hello, ${user.username}!`;
    } else {
      msg.textContent = "Incorrect username/email or password!";
      msg.style.color = "red";
    }
  }
</script>

</body>
</html>
